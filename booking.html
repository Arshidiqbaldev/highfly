<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>high fly air services</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="main">

        <div class="parent">
            <div class="content-div">
                <div class="booking">
                    <svg xmlns="http://www.w3.org/2000/svg" class="back-btn"
                        viewBox="0 0 24 24"><!-- Icon from Huge Icons by Hugeicons - undefined -->
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5" d="M15 6.65s-6.938-.542-7.915.435S6.65 15 6.65 15m.85-7.5l10 10" />
                    </svg>
                    <h1 class="services-head">Book Your Flight with Us</h1>
                    <p class="booking-description">
                        Experience the convenience and luxury of booking your flight with High Fly Air Services. Our
                        user-friendly online booking system allows you to easily search for flights, compare prices, and
                        secure your reservation in just a few clicks.
                    </p>
                    <form action="" class="contact-form">
                        <input type="text" placeholder="Name" class="input-field" />
                        <input type="email" placeholder="Email" class="input-field" />
                        <input type="text" placeholder="Phone Number" class="input-field" />
                        <input type="text" placeholder="Destination" class="input-field" />
                        <input type="date" placeholder="Departure Date" class="input-field" />
                        <input type="date" placeholder="Return Date" class="input-field" />
                        <button type="submit" class="form-btn">Book Now</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
